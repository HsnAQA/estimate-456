# CPIT 456 Estimation Lab theme. Colors follow the semantic tokens in ../design.md.
# Light is the base theme. Users can switch to dark under Settings in the app menu.

[client]
# "viewer" keeps the Settings menu, which holds the light and dark theme choice,
# and hides developer-only actions. "minimal" would hide the theme choice.
toolbarMode = "viewer"

[server]
headless = true
showEmailPrompt = false
# Serves static/fonts so the bundled IBM Plex Sans files can be used offline.
enableStaticServing = true

[theme]
base = "light"
font = "IBM Plex Sans, Segoe UI, Arial, sans-serif"
codeFont = "Cascadia Code, Consolas, monospace"
baseFontSize = 15
baseFontWeight = 400
baseRadius = "6px"
buttonRadius = "6px"
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Medium.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = 600
style = "normal"

[theme.light]
primaryColor = "#0969DA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#1F2328"
linkColor = "#0969DA"
codeTextColor = "#1F2328"
codeBackgroundColor = "#F0F3F6"
borderColor = "#D0D7DE"
dataframeBorderColor = "#D0D7DE"
dataframeHeaderBackgroundColor = "#EAEEF2"
blueColor = "#0969DA"
greenColor = "#1A7F37"
yellowColor = "#9A6700"
orangeColor = "#9A6700"
redColor = "#CF222E"
violetColor = "#59636E"
grayColor = "#59636E"
chartCategoricalColors = ["#0969DA", "#59636E", "#1A7F37", "#9A6700", "#CF222E"]

[theme.light.sidebar]
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#EAEEF2"
textColor = "#1F2328"
primaryColor = "#0969DA"
borderColor = "#D0D7DE"
codeBackgroundColor = "#EAEEF2"

[theme.dark]
primaryColor = "#58A6FF"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
linkColor = "#58A6FF"
codeTextColor = "#E6EDF3"
codeBackgroundColor = "#010409"
borderColor = "#30363D"
dataframeBorderColor = "#30363D"
dataframeHeaderBackgroundColor = "#21262D"
blueColor = "#58A6FF"
greenColor = "#3FB950"
yellowColor = "#D29922"
orangeColor = "#D29922"
redColor = "#F85149"
violetColor = "#B1BAC4"
grayColor = "#B1BAC4"
chartCategoricalColors = ["#58A6FF", "#B1BAC4", "#3FB950", "#D29922", "#F85149"]

[theme.dark.sidebar]
backgroundColor = "#161B22"
secondaryBackgroundColor = "#21262D"
