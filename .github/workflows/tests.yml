name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (unit and browser)
    # Windows runners ship with Microsoft Edge, which the browser suite drives.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/*.test.js"
      - name: Browser tests
        run: node tests/e2e/run-e2e.mjs
      - name: Build the site folder
        run: node tools/build-site.js

  streamlit:
    name: Streamlit app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: streamlit-app/requirements.txt
      - name: Install requirements
        run: python -m pip install -r streamlit-app/requirements.txt
      - name: Tests
        working-directory: streamlit-app
        run: python -m unittest discover -s tests -v
